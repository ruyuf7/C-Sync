<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="C-sync">
  <defs>
    <linearGradient id="cs-arc" x1="100" y1="10" x2="20" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="cs-sweep" cx="60" cy="60" r="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0"/>
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0.45"/>
    </radialGradient>
    <filter id="cs-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- radar rings and crosshair -->
  <g fill="none" stroke="#67e8f9" stroke-opacity="0.28" stroke-width="1">
    <circle cx="60" cy="60" r="31"/>
    <circle cx="60" cy="60" r="19"/>
    <path d="M60 27v66M27 60h66" stroke-opacity="0.16"/>
  </g>
  <!-- sweep trailing the needle -->
  <path d="M60 60 L81.9 34 A34 34 0 0 1 91.6 47.3 Z" fill="url(#cs-sweep)"/>
  <!-- the C: open on the right -->
  <path d="M91.1 28.9 A44 44 0 1 0 91.1 91.1" fill="none" stroke="url(#cs-arc)"
        stroke-width="13" stroke-linecap="round" filter="url(#cs-glow)"/>
  <!-- needle -->
  <g filter="url(#cs-glow)">
    <line x1="60" y1="60" x2="81.9" y2="34" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round"/>
    <circle cx="81.9" cy="34" r="2.6" fill="#67e8f9"/>
    <circle cx="60" cy="60" r="4.2" fill="#f0f9ff"/>
  </g>
</svg>
