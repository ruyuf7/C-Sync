<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1400 1080" width="1400" height="1080" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b7cf6"/>
    </marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f5b942"/>
    </marker>

    <!-- Line icons (24x24, stroke = currentColor), after the Tool Wrappers slide -->
    <symbol id="i-robot" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="8" width="16" height="12" rx="3.5"/>
      <path d="M12 8V5"/><circle cx="12" cy="3.6" r="1.4"/>
      <circle cx="9" cy="13.5" r="1.3" fill="currentColor"/><circle cx="15" cy="13.5" r="1.3" fill="currentColor"/>
      <path d="M10 17h4"/><path d="M2 12.5v3.5M22 12.5v3.5"/>
    </symbol>
    <symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2.8 19.5 5.8V11c0 5-3.2 8.6-7.5 10.2C7.7 19.6 4.5 16 4.5 11V5.8Z"/>
      <path d="m8.8 11.9 2.2 2.2 4.3-4.4"/>
    </symbol>
    <symbol id="i-doc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4.5" y="2.8" width="15" height="18.4" rx="2.2"/>
      <path d="M8.3 8h.01M8.3 12h.01M8.3 16h.01" stroke-width="2.4"/>
      <path d="M11 8h5M11 12h5M11 16h5"/>
    </symbol>
    <symbol id="i-gauge" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.6 17.5a9.2 9.2 0 1 1 16.8 0"/>
      <path d="M12 14.2 16.2 9.2"/><circle cx="12" cy="14.6" r="1.5" fill="currentColor"/>
      <path d="M6.3 11.3h.01M8.4 7.9h.01M12 6.6h.01" stroke-width="2.4"/>
    </symbol>
    <symbol id="i-person" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="7.6" r="4.2"/>
      <path d="M4 21c.4-4.4 3.7-6.9 8-6.9s7.6 2.5 8 6.9"/>
    </symbol>
    <symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
      <path d="M19.49 10.71 L21.93 10.80 L21.93 13.20 L19.49 13.29 L18.21 16.39 L19.87 18.17 L18.17 19.87 L16.39 18.21 L13.29 19.49 L13.20 21.93 L10.80 21.93 L10.71 19.49 L7.61 18.21 L5.83 19.87 L4.13 18.17 L5.79 16.39 L4.51 13.29 L2.07 13.20 L2.07 10.80 L4.51 10.71 L5.79 7.61 L4.13 5.83 L5.83 4.13 L7.61 5.79 L10.71 4.51 L10.80 2.07 L13.20 2.07 L13.29 4.51 L16.39 5.79 L18.17 4.13 L19.87 5.83 L18.21 7.61 Z"/>
      <circle cx="12" cy="12" r="3.2"/>
    </symbol>
    <symbol id="i-tools" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <!-- wrench: open head top-left, handle to bottom-right -->
      <path d="M14.2 5.2a4.4 4.4 0 0 0-5.9 5.4L3.4 15.5a2.1 2.1 0 0 0 3 3l4.9-4.9a4.4 4.4 0 0 0 5.4-5.9l-2.6 2.6-2.4-.6-.6-2.4Z"/>
      <!-- screwdriver: tip bottom-left of top-right handle -->
      <path d="m13.6 13.6 2.3 2.3"/><path d="m15.6 17.8 2.2 2.2a1.6 1.6 0 0 0 2.2-2.2l-2.2-2.2Z"/>
      <path d="M12.3 12.3 10 10"/>
    </symbol>

    <style>
      .box{fill:#201f2e;stroke:#3b3a5c;stroke-width:1.5}
      .hdr{fill:#2c2a4f}
      .h{fill:#f4f3ff;font-weight:700;font-size:19px}
      .t{fill:#f4f3ff;font-weight:700;font-size:17px}
      .d{fill:#aeb0c8;font-size:14px}
      .lbl{fill:#aeb0c8;font-weight:700;font-size:15px}
      .ln{fill:none;stroke:#8b7cf6;stroke-width:2}
      .ic{color:#b9adfb}
      .tl{fill:#aeb0c8;font-size:14px;font-family:'JetBrains Mono',Consolas,'Courier New',monospace}
    </style>
    </defs>

  <rect width="1400" height="1080" fill="#17161f"/>
  <text x="40" y="48" fill="#f4f3ff" font-size="28" font-weight="700">AI Trend Agent: how a signal becomes a recommendation</text>
  <text x="40" y="76" fill="#aeb0c8" font-size="16">The agents recommend. A person decides.</text>
  <text x="40" y="118" class="lbl">Monitoring</text>
  <rect x="40" y="130" width="240" height="62" rx="10" class="box"/>
  <text x="56" y="156" class="t">GitHub releases</text>
  <text x="56" y="178" class="d">6 watched repos</text>
  <rect x="40" y="206" width="240" height="62" rx="10" class="box"/>
  <text x="56" y="232" class="t">Official blogs / RSS</text>
  <text x="56" y="254" class="d">LangChain · OpenAI · Hugging Face</text>
  <rect x="40" y="302" width="240" height="68" rx="10" class="box"/>
  <use href="#i-gear" xlink:href="#i-gear" x="54" y="312" width="24" height="24" class="ic"/>
  <text x="86" y="330" class="t">Clustering</text>
  <text x="56" y="355" class="d">No LLM, same result every run</text>
  <path class="ln" d="M40 161 H24 V336 H38" marker-end="url(#ah)"/>
  <path class="ln" d="M160 268 V300" marker-end="url(#ah)"/>
  <path class="ln" d="M280 336 H310 V150 H338" marker-end="url(#ah)"/>
  <rect x="40" y="430" width="240" height="110" rx="10" fill="none" stroke="#6b6a8c" stroke-width="1.5" stroke-dasharray="7 6"/>
  <use href="#i-gauge" xlink:href="#i-gauge" x="54" y="441" width="24" height="24" class="ic"/>
  <text x="86" y="459" class="t">Evaluation harness</text>
  <text x="56" y="486" class="d">Grades the whole pipeline</text>
  <text x="56" y="506" class="d">against human-labelled</text>
  <text x="56" y="526" class="d">signals</text>
  <rect x="340" y="100" width="560" height="132" rx="12" class="box"/>
  <rect x="356" y="112" width="528" height="34" rx="8" class="hdr"/>
  <use href="#i-robot" xlink:href="#i-robot" x="366" y="116" width="26" height="26" class="ic"/>
  <text x="402" y="136" class="h">Agent 1 · Verification: is it real?</text>
  <rect x="372" y="156" width="290" height="28" rx="14" fill="#123b33" stroke="#34d399"/>
  <use href="#i-shield" xlink:href="#i-shield" x="382" y="161" width="18" height="18" style="color:#6ee7b7"/>
  <text x="533" y="175" fill="#6ee7b7" font-size="13.5" font-weight="700" text-anchor="middle">Confidence computed in code</text>
  <rect x="674" y="156" width="206" height="28" rx="14" fill="#0f3340" stroke="#67e8f9"/>
  <use href="#i-shield" xlink:href="#i-shield" x="684" y="161" width="18" height="18" style="color:#a5f3fc"/>
  <text x="793" y="175" fill="#a5f3fc" font-size="13.5" font-weight="700" text-anchor="middle">Tools behind guards</text>
  <use href="#i-tools" xlink:href="#i-tools" x="372" y="203" width="18" height="18" style="color:#8f90aa"/>
  <text x="398" y="216" class="tl">github_lookup · verify_release</text>
  <path class="ln" d="M620 232 V256" marker-end="url(#ah)"/>
  <rect x="340" y="258" width="560" height="132" rx="12" class="box"/>
  <rect x="356" y="270" width="528" height="34" rx="8" class="hdr"/>
  <use href="#i-robot" xlink:href="#i-robot" x="366" y="274" width="26" height="26" class="ic"/>
  <text x="402" y="294" class="h">Agent 2 · Curriculum: where is it taught?</text>
  <rect x="372" y="314" width="236" height="28" rx="14" fill="#2c2a4f" stroke="#8b7cf6"/>
  <use href="#i-doc" xlink:href="#i-doc" x="382" y="319" width="18" height="18" style="color:#e4e0ff"/>
  <text x="506" y="333" fill="#e4e0ff" font-size="13.5" font-weight="700" text-anchor="middle">Cites week · file · cell</text>
  <rect x="620" y="314" width="260" height="28" rx="14" fill="#3f1d24" stroke="#f87171"/>
  <use href="#i-shield" xlink:href="#i-shield" x="630" y="319" width="18" height="18" style="color:#fca5a5"/>
  <text x="766" y="333" fill="#fca5a5" font-size="13.5" font-weight="700" text-anchor="middle">Failed search ≠ “no match”</text>
  <use href="#i-tools" xlink:href="#i-tools" x="372" y="361" width="18" height="18" style="color:#8f90aa"/>
  <text x="398" y="374" class="tl">search_curriculum</text>
  <path class="ln" d="M620 390 V414" marker-end="url(#ah)"/>
  <rect x="340" y="416" width="560" height="96" rx="12" class="box"/>
  <rect x="356" y="428" width="528" height="34" rx="8" class="hdr"/>
  <use href="#i-robot" xlink:href="#i-robot" x="366" y="432" width="26" height="26" class="ic"/>
  <text x="402" y="452" class="h">Agent 3 · Evaluation: how much does it matter?</text>
  <use href="#i-tools" xlink:href="#i-tools" x="372" y="481" width="18" height="18" style="color:#8f90aa"/>
  <text x="398" y="494" class="tl">No tool calls · maturity + relevance scored in code</text>
  <path class="ln" d="M620 512 V536" marker-end="url(#ah)"/>
  <rect x="340" y="538" width="560" height="96" rx="12" class="box"/>
  <rect x="356" y="550" width="528" height="34" rx="8" class="hdr"/>
  <use href="#i-robot" xlink:href="#i-robot" x="366" y="554" width="26" height="26" class="ic"/>
  <text x="402" y="574" class="h">Agent 4 · Recommendation: what should change?</text>
  <use href="#i-tools" xlink:href="#i-tools" x="372" y="603" width="18" height="18" style="color:#8f90aa"/>
  <text x="398" y="616" class="tl">No tool calls · tier gates in code, LLM writes plan</text>
  <path class="ln" d="M620 634 V718" marker-end="url(#ah)"/>
  <path class="ln" d="M900 150 H958" marker-end="url(#ah)"/>
  <rect x="960" y="112" width="400" height="76" rx="10" class="box"/>
  <use href="#i-tools" xlink:href="#i-tools" x="976" y="124" width="26" height="26" class="ic"/>
  <text x="1012" y="143" class="t">GitHub API</text>
  <text x="980" y="170" class="d">Repo lookup · release check</text>
  <path class="ln" d="M900 322 H958" marker-end="url(#ah)"/>
  <path d="M960 290 V350 A200 16 0 0 0 1360 350 V290" fill="#201f2e" stroke="#3b3a5c" stroke-width="1.5"/>
  <ellipse cx="1160" cy="290" rx="200" ry="16" fill="#2c2a4f" stroke="#3b3a5c" stroke-width="1.5"/>
  <use href="#i-tools" xlink:href="#i-tools" x="976" y="312" width="26" height="26" class="ic"/>
  <text x="1012" y="331" class="t">WeCloudData course index</text>
  <text x="980" y="355" class="d">Slides + lab cells, weeks 2–6 · ChromaDB</text>
  <rect x="960" y="398" width="400" height="112" rx="10" class="box"/>
  <text x="980" y="426" class="t">Five action tiers</text>
  <g font-size="14" fill="#d9d8ec">
    <circle cx="986" cy="447" r="4.5" fill="#9b9ab3"/><text x="998" y="452">Watch</text>
    <circle cx="1116" cy="447" r="4.5" fill="#8b7cf6"/><text x="1128" y="452">Update existing material</text>
    <circle cx="986" cy="472" r="4.5" fill="#8b7cf6"/><text x="998" y="477">Add optional content</text>
    <circle cx="1176" cy="472" r="4.5" fill="#8b7cf6"/><text x="1188" y="477">Add new lesson</text>
    <circle cx="986" cy="497" r="4.5" fill="#9b9ab3"/><text x="998" y="502" fill="#aeb0c8">Investigate larger change (not reachable yet)</text>
  </g>
  <path class="ln" d="M900 586 H958" marker-end="url(#ah)"/>
  <rect x="960" y="534" width="400" height="104" rx="10" class="box"/>
  <use href="#i-doc" xlink:href="#i-doc" x="976" y="545" width="26" height="26" class="ic"/>
  <text x="1012" y="564" class="t">C-Sync dashboard</text>
  <text x="980" y="592" class="d">Streamlit, runs on a saved snapshot.</text>
  <text x="980" y="614" class="d">Every card keeps its full trace.</text>
  <path class="ln" d="M1160 638 V718" marker-end="url(#ah)"/>
  <path class="ln" d="M340 600 H312 V898" marker-end="url(#ah)"/>
  <text x="634" y="672" class="d">on request, for</text>
  <text x="634" y="692" class="d">“update existing material”</text>
  <rect x="340" y="720" width="560" height="140" rx="12" class="box"/>
  <rect x="356" y="732" width="528" height="34" rx="8" class="hdr"/>
  <use href="#i-robot" xlink:href="#i-robot" x="366" y="736" width="26" height="26" class="ic"/>
  <text x="402" y="756" class="h">Agent 6 · Fix drafter: what is the fix?</text>
  <rect x="372" y="776" width="226" height="28" rx="14" fill="#2c2a4f" stroke="#8b7cf6"/>
  <use href="#i-doc" xlink:href="#i-doc" x="382" y="781" width="18" height="18" style="color:#e4e0ff"/>
  <text x="501" y="795" fill="#e4e0ff" font-size="13.5" font-weight="700" text-anchor="middle">Draft only, never applied</text>
  <rect x="610" y="776" width="270" height="28" rx="14" fill="#2c2a4f" stroke="#8b7cf6"/>
  <use href="#i-doc" xlink:href="#i-doc" x="620" y="781" width="18" height="18" style="color:#e4e0ff"/>
  <text x="761" y="795" fill="#e4e0ff" font-size="13.5" font-weight="700" text-anchor="middle">Flags names it cannot source</text>
  <use href="#i-tools" xlink:href="#i-tools" x="372" y="823" width="18" height="18" style="color:#8f90aa"/>
  <text x="398" y="836" class="tl">full lab cell (course index) · release notes</text>
  <path class="ln" d="M620 860 V898" marker-end="url(#ah)"/>
  <rect x="960" y="720" width="400" height="140" rx="12" class="box"/>
  <rect x="976" y="732" width="368" height="34" rx="8" class="hdr"/>
  <use href="#i-robot" xlink:href="#i-robot" x="986" y="736" width="26" height="26" class="ic"/>
  <text x="1022" y="756" class="h">Agent 5 · Instructor Companion</text>
  <rect x="992" y="776" width="190" height="28" rx="14" fill="#2c2a4f" stroke="#8b7cf6"/>
  <use href="#i-shield" xlink:href="#i-shield" x="1002" y="781" width="18" height="18" style="color:#e4e0ff"/>
  <text x="1103" y="795" fill="#e4e0ff" font-size="13.5" font-weight="700" text-anchor="middle">Checked citations</text>
  <use href="#i-tools" xlink:href="#i-tools" x="992" y="823" width="18" height="18" style="color:#8f90aa"/>
  <text x="1018" y="836" class="tl">search_curriculum · GitHub (cache)</text>
  <path class="ln" d="M1160 896 V862" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <rect x="40" y="900" width="1320" height="140" rx="14" fill="#1f1d33" stroke="#8b7cf6" stroke-width="2"/>
  <circle cx="92" cy="960" r="26" fill="#2c2a4f" stroke="#8b7cf6" stroke-width="1.5"/>
  <use href="#i-person" xlink:href="#i-person" x="76" y="944" width="32" height="32" class="ic"/>
  <text x="134" y="952" class="h">Instructor approves or rejects every recommendation and every drafted fix</text>
  <text x="134" y="980" class="d">The trace shows why the agent decided, so a wrong reason gets caught. Nothing in the course changes without approval.</text>
  <rect x="134" y="996" width="190" height="28" rx="14" fill="#3b2f16" stroke="#f5b942"/>
  <use href="#i-shield" xlink:href="#i-shield" x="144" y="1001" width="18" height="18" style="color:#fcd34d"/>
  <text x="245" y="1015" fill="#fcd34d" font-size="13.5" font-weight="700" text-anchor="middle">Human in the loop</text>
</svg>
